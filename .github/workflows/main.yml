name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q XiOptimizer.zip -d work
      - name: Build
        run: |
          cd work/xiopt
          gradle assembleDebug --no-daemon > ../build.log 2>&1 || {
            grep -E '^e: |What went wrong|Could not|error:' ../build.log | head -9 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: XiOptimizer-apk
          path: work/xiopt/app/build/outputs/apk/debug/app-debug.apk
